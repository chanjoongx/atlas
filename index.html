    <!-- Without scripting these two follow the OS. The script below takes the
         first one over as soon as it runs, and a browser uses the first tag
         whose media matches, so an unconditional first tag always wins. -->
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />

    <!--
      Resolve the theme before the first paint, so there is no flash of the
      wrong background. The contract matches src/lib/theme.ts: the key is
      atlas.theme, the values are carbon and paper, and the OS decides until
      the visitor states a preference.

      This has to sit after the theme-color tags. Parsing is top down, so from
      any earlier position the querySelector below finds nothing and silently
      does nothing.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('atlas.theme');
          if (theme !== 'carbon' && theme !== 'paper') {
            theme =
              window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
                ? 'paper'
                : 'carbon';
          }
          var colour = theme === 'carbon' ? '#0b0c0e' : '#faf9f7';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.background = colour;
          var meta = root.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.removeAttribute('media');
            meta.setAttribute('content', colour);
          }
        } catch (e) {
          /* no storage, private mode: carbon is already the default */
        }
      })();
    </script>
